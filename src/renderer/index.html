<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:;"
    />
    <title>Udseen Editor</title>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
  <style>
    /* 全局细滚动条样式 */
    *::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.2);
    }
    *::-webkit-scrollbar-corner {
      background: transparent;
    }
  </style>
</html>
